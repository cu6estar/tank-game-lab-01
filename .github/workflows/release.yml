name: Release

# За тегом v* збираємо Docker-образ, публікуємо в GHCR і (якщо налаштовано)
# смикаємо deploy-hook хостингу.
on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Хостинг-незалежний деплой: більшість платформ (Render, Railway, Fly…)
      # дають deploy-hook — URL, POST на який запускає викатку свіжого образу.
      # Поклади URL у секрет DEPLOY_HOOK_URL. Без секрета крок просто пропускається.
      - name: Trigger deploy hook
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DEPLOY_HOOK_URL не задано — пропускаю (образ у GHCR готовий до ручної викатки)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "deploy-hook смикнуто"
