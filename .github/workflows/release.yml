name: Release

# За тегом v* збираємо Docker-образ, публікуємо в GHCR і (якщо налаштовано)
# смикаємо deploy-hook хостингу.
on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Деплой на Fly.io. Поклади токен у секрет FLY_API_TOKEN
      # (flyctl tokens create deploy). Без токена крок просто пропускається —
      # образ у GHCR лишається готовим до ручної викатки.
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN не задано — пропускаю деплой (образ у GHCR готовий)."
            exit 0
          fi
          flyctl deploy --remote-only --build-arg GIT_SHA="${GITHUB_SHA}"
